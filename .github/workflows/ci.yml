name: repository-verification

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Bootstrap exact Node and pnpm toolchain
        run: bash tooling/ci/bootstrap-toolchain.sh
      - name: Frozen install
        run: bash tooling/ci/install.sh
      - name: Run repository-owned verification
        run: pnpm check
